name: Gerar IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Instalar XcodeGen
        run: brew install xcodegen
      - name: Gerar projeto
        run: xcodegen generate
      - name: Compilar
        run: |
          xcodebuild archive \
            -project Trocado.xcodeproj \
            -scheme Trocado \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Trocado.xcarchive \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" 2>&1 | tee build.log | grep -E "error:|\*\* ARCHIVE|Resolve Package" || true
          exit ${PIPESTATUS[0]}
      - name: Mostrar erros
        if: failure()
        run: grep -E "error:" build.log | sort -u | head -80 || true
      - name: Empacotar IPA
        run: |
          mkdir -p Payload
          cp -R build/Trocado.xcarchive/Products/Applications/Trocado.app Payload/
          zip -qry Trocado.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Trocado-ipa
          path: Trocado.ipa
